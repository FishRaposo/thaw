<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thaw</title>
  <meta name="description" content="An ice-sliding puzzle game in twelve rooms. Ice keeps you going, snow stops you; crates, water and cracked ice do the rest.">
  <style>
    html, body { margin: 0; height: 100%; background: #c9d9e4; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    noscript { position: fixed; inset: 0; display: grid; place-items: center; font: 16px Georgia, serif; color: #1e2a35; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="Thaw: game canvas. Choose a level with the arrow keys and press Enter."></canvas>
  <noscript>Thaw needs JavaScript to run.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
